name: Android Device Smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-device-smoke.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-device-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Assemble debug APK
        working-directory: apps/android
        run: gradle --no-daemon assembleDebug
      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -q 'com.attentionfirewall'
            adb shell am start -n com.attentionfirewall/.MainActivity
            adb shell dumpsys activity activities | grep -q 'com.attentionfirewall/.MainActivity'
            adb shell settings put secure enabled_accessibility_services com.attentionfirewall/com.attentionfirewall.AttentionAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am force-stop com.attentionfirewall
            adb shell am start -n com.attentionfirewall/.MainActivity
            adb shell dumpsys accessibility | grep -q 'com.attentionfirewall/com.attentionfirewall.AttentionAccessibilityService'
            adb shell dumpsys package com.attentionfirewall | grep -q 'AttentionAccessibilityService'
