name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @attention-firewall/web... build
      - run: pnpm test
      - run: pnpm audit --audit-level high
      - run: pnpm security:extension
      - name: Check for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude='*.lock' --exclude='ci.yml' '(AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|github_pat_|ghp_[A-Za-z0-9_]{20,})' .

  security-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f SECURITY.md
      - run: test -f docs/SECURITY.md
