name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile --allow-build=esbuild
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - run: pnpm security:extension
      - name: Check for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude='*.lock' '(AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|github_pat_|ghp_[A-Za-z0-9_]{20,})' .

  security-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f SECURITY.md
      - run: test -f docs/SECURITY.md
