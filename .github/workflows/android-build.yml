name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "packages/runtime-protocol/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/runtime-protocol/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Assemble debug
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.attentionfirewall/.MainActivity
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | grep -q "Attention Firewall"
            adb shell cat /sdcard/window.xml | grep -q "Set your distraction cooldown"
            adb shell pm list packages | grep -q "com.attentionfirewall"
