version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: bundler
    directory: /apps/ios
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
