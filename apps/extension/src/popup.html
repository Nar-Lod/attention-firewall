<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Attention Firewall</title><style>body{width:330px;margin:0;padding:20px;background:#0a0a0a;color:#fff;font:14px system-ui,sans-serif}h1{font-size:18px;margin:0 0 6px}.muted{color:#858585;line-height:1.5;font-size:12px}label{display:block;margin-top:16px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#cfae54}input{width:100%;margin-top:8px;padding:11px;background:#151515;border:1px solid #333;color:#fff;box-sizing:border-box}button{margin-top:16px;padding:11px 14px;border:0;background:#b83343;color:#fff;font-weight:700;cursor:pointer}.status{margin-top:14px;color:#8fc59a;font-size:12px}</style></head><body><h1>Attention Firewall</h1><div class="muted">Your intent and attention state remain local to this browser.</div><label for="intent">Current intent</label><input id="intent" maxlength="120" placeholder="e.g. Research for 20 minutes"><label for="domains">Allowed domains for this intent</label><input id="domains" maxlength="500" placeholder="docs.google.com, scholar.google.com"><button id="save" type="button">Save locally</button><div id="status" class="status" role="status"></div><script src="../dist/popup.js"></script></body></html>
